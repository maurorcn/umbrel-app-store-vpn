manifestVersion: 1
id: vpn-transmission
storage:
  dataRoot: data
category: networking
name: Transmission (VPN)
version: "4.1.3"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/transmission.png
tagline: Transmission protegido por Gluetun com kill switch
description: >-
  Transmission a correr dentro da rede do Gluetun. Todo o tráfego do cliente
  passa obrigatoriamente pela VPN e, se o túnel cair, o firewall do Gluetun
  bloqueia tudo (kill switch), por isso o teu IP real nunca é exposto.


  ⚠️ ANTES DE INSTALAR: cria o ficheiro com as credenciais da VPN em
  ~/umbrel/app-data/vpn-transmission/gluetun.env (ver README da store).
  Sem ele, o Gluetun não liga e o Transmission fica sem rede (por design).


  Inclui os widgets de estado e lista de torrents do Umbrel.
developer: Transmission + Gluetun
website: https://transmissionbt.com/
dependencies: []
repo: https://github.com/CHANGE-ME/umbrel-vpn-store
support: https://github.com/CHANGE-ME/umbrel-vpn-store/issues
port: 9091
gallery: []
path: "/transmission/web/"
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  Primeira versão: Transmission 4.1.3 atrás do Gluetun com kill switch.
permissions:
  - STORAGE_DOWNLOADS
widgets:
  - id: "status"
    type: "four-stats"
    refresh: "5s"
    endpoint: "widget-server:80/widgets/status"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Downloading"
          text: "3"
          subtext: "torrents"
        - title: "Seeding"
          text: "1"
          subtext: "torrents"
        - title: "Stopped"
          text: "0"
          subtext: "torrents"
        - title: "Queued"
          text: "2"
          subtext: "torrents"
  - id: "torrent-list"
    type: "list"
    refresh: "2s"
    endpoint: "widget-server:80/widgets/torrent-list"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "33% • Ubuntu 22.04.3 amd64 ISO image"
          subtext: "↓4.4Mbps ↑1.2Mbps"
        - text: "100% • Ubuntu 21.1.0 amd64 ISO image"
          subtext: "↓0Mbps ↑78Kbps"
submitter: Eu
submission: https://github.com/CHANGE-ME/umbrel-vpn-store