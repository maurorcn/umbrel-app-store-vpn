services:
  app_proxy:
    environment:
      # o WebUI é exposto pelo contentor gluetun (network_mode: service:gluetun)
      APP_HOST: vpn-qbittorrent_gluetun_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"   # o qBittorrent tem login próprio

  gluetun:
    image: qmcgaw/gluetun:latest   # TODO: fixar tag@sha256 como nas apps oficiais
    restart: on-failure
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Credenciais da VPN: ficheiro criado por ti (ver examples/gluetun.env.example)
    env_file:
      - path: ${APP_DATA_DIR}/gluetun.env
        required: false
    environment:
      TZ: Europe/Lisbon
      # ---- KILL SWITCH ----
      # O firewall do Gluetun está SEMPRE ativo e bloqueia tudo o que não passe
      # pelo túnel. Aqui só abrimos o necessário para o WebUI/app_proxy:
      FIREWALL: "on"
      FIREWALL_INPUT_PORTS: "8080"
      # rede docker do Umbrel (app_proxy) + LAN doméstica (apenas rede local, não Internet)
      FIREWALL_OUTBOUND_SUBNETS: "10.21.0.0/16,192.168.0.0/16"
      # DNS sobre TLS dentro do túnel
      DOT: "on"
      HEALTH_TARGET_ADDRESS: "1.1.1.1:443"
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun
    # Nota: o gluetun tem healthcheck interno; o qbittorrent só arranca quando estiver "healthy"

  server:
    image: lscr.io/linuxserver/qbittorrent:latest   # TODO: fixar tag@sha256 como nas apps oficiais
    restart: on-failure
    # KILL SWITCH #2: sem rede própria. Usa APENAS a stack de rede do gluetun.
    # Se o gluetun parar, o qbittorrent fica sem rede nenhuma.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
      WEBUI_PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
